# ═══════════════════════════════════════════════════════════════
#  config/data_sources.yaml — Viabilidad IA Datacenters AR
#  Catálogo de fuentes de datos del proyecto
#
#  REGLA AGENTS.md §4.5 (Trazabilidad total):
#  Todo dataset incorporado al pipeline DEBE tener una entrada aquí
#  antes de ser descargado a data/01_raw/.
#
#  Campos obligatorios:
#    nombre         — Nombre descriptivo del dataset
#    dimension      — Categoría analítica (ver valores válidos abajo)
#    fuente_oficial — Organismo / entidad responsable del dato
#    url            — URL de descarga directa o endpoint de API
#    fecha_corte    — Fecha del último dato disponible (YYYY-MM-DD)
#    estado         — Estado de incorporación al pipeline
#
#  Dimensiones válidas:
#    energia        — Generación, capacidad, red SADI, costo kWh
#    conectividad   — Fibra troncal, IXPs, cables submarinos, latencia
#    clima          — Temperatura, humedad, free cooling, PUE potencial
#    hidrica        — Disponibilidad hídrica para refrigeración
#    regulatorio    — Marco legal, habilitaciones, zonas francas
#    fiscal         — RIGI, IIBB, incentivos provinciales
#    logistica      — Infraestructura vial, ferroviaria, aeroportuaria
#    talento        — Capital humano IT, universidades, egresados
#
#  Estados válidos:
#    borrador       — Identificada, no validada
#    validado       — Fuente oficial confirmada, URL verificada
#    descargado     — Archivo presente en data/01_raw/
#    procesado      — Incorporado a data/02_interim/ o superior
# ═══════════════════════════════════════════════════════════════

fuentes:
  - nombre: "Open-Meteo Historical API (ERA5 / ECMWF)"
    dimension: "clima"
    fuente_oficial: "ECMWF / Open-Meteo"
    url: "https://archive-api.open-meteo.com/v1/archive"
    fecha_corte: "2023-12-31"
    periodicidad: "diaria"
    estado: "procesado"
    archivo_raw: "data/01_raw/clima_24_jurisdicciones_raw.json"
    script_etl: "src/gis/fetch_clima_pue.py"
    notas: "Serie 2000-01-01 a 2023-12-31 (8.766 días por jurisdicción). Variables calculadas: temp_media_anual_c, temp_max_verano_prom_c, horas_free_cooling_estimadas (Tbs < 15°C ASHRAE 90.4) y pue_climatologico_estimado."

  - nombre: "WRI Aqueduct 4.0 — Water Risk Atlas"
    dimension: "hidrica"
    fuente_oficial: "World Resources Institute (WRI)"
    url: "https://www.wri.org/applications/aqueduct/water-risk-atlas/"
    fecha_corte: "2023-01-01"
    periodicidad: "puntual"
    estado: "borrador"
    archivo_raw: "data/01_raw/aqueduct40_province_rankings_arg.csv"
    script_etl: "src/gis/fetch_clima_pue.py"
    notas: "Descarga automatizada no disponible sin formulario. Variable indice_estres_hidrico quedó explícitamente en NaN (100% auditable) a la espera de descarga manual según regla de cero datos inventados."

  - nombre: "Centrales de Generación Eléctrica SADI"
    dimension: "energia"
    fuente_oficial: "Secretaría de Energía / CAMMESA"
    url: "http://datos.energia.gob.ar/dataset/c62df6c6-73af-4039-b956-db081ff6eebe/resource/230fdf38-8f12-4017-a1e8-d7a1bc4a1c1c/download/generacin-elctrica-centrales-de-generacin.csv"
    fecha_corte: "2024-01-01"
    periodicidad: "anual"
    estado: "procesado"
    archivo_raw: "data/01_raw/cammesa_centrales_generacion_sadi_raw.csv"
    script_etl: "src/etl/fetch_energia_sadi.py"
    notas: "474 centrales registradas en el SADI con geolocalización, provincia, tecnología y potencia instalada en MW. Tierra del Fuego tratada como sistema aislado (0.0 MW en SADI)."

  - nombre: "CAMMESA — Potencia Instalada Histórica"
    dimension: "energia"
    fuente_oficial: "CAMMESA / datos.energia.gob.ar"
    url: "http://datos.energia.gob.ar/dataset/2b4dfee6-6fca-4e4d-9611-a12d65cd4aa8/resource/b05fbb16-7278-463f-8895-087e2495bfee/download/potencia-instalada.csv"
    fecha_corte: "2020-02-01"
    periodicidad: "mensual"
    estado: "descargado"
    archivo_raw: "data/01_raw/cammesa_potencia_instalada_raw.csv"
    script_etl: "src/etl/fetch_energia_sadi.py"
    notas: "Serie mensual histórica de potencia instalada desagregada por agente y región eléctrica CAMMESA."

  - nombre: "Proyectos y Centrales RenovAr / MATER"
    dimension: "energia"
    fuente_oficial: "Secretaría de Energía / Subsecretaría de Energías Renovables"
    url: "http://datos.energia.gob.ar/dataset/7c30754f-7ee7-45c4-bbb8-fb853b20fe3a/resource/dc334eb4-3450-45c6-a340-37494c78e090/download/centrales-y-proyectos-de-centrales-de-energa-renovable.csv"
    fecha_corte: "2020-01-01"
    periodicidad: "anual"
    estado: "descargado"
    archivo_raw: "data/01_raw/minem_renovar_mater_raw.csv"
    script_etl: "src/etl/fetch_energia_sadi.py"
    notas: "Catálogo geolocalizado de proyectos renovables adjudicados por rondas RenovAr y régimen MATER."

  - nombre: "ENACOM — Accesos a Internet Fijo por Tecnología"
    dimension: "conectividad"
    fuente_oficial: "ENACOM / datos.gob.ar"
    url: "https://indicadores.enacom.gob.ar/Files/DatosAbiertos/internet_accesos_tecnologias_provincias.csv"
    fecha_corte: "2026-06-30"
    periodicidad: "trimestral"
    estado: "procesado"
    archivo_raw: "data/01_raw/enacom_internet_tecnologias_raw.csv"
    script_etl: "src/gis/fetch_conectividad.py"
    notas: "Accesos a internet fijo por provincia y tecnología (Fibra Óptica / FTTH, Cablemódem, ADSL, Wireless, Otros). Serie trimestral histórica hasta 2026-T2."

  - nombre: "ENACOM — Penetración de Internet Fijo"
    dimension: "conectividad"
    fuente_oficial: "ENACOM / datos.gob.ar"
    url: "https://indicadores.enacom.gob.ar/Files/DatosAbiertos/internet_accesos_penetracion_provincias.csv"
    fecha_corte: "2026-06-30"
    periodicidad: "trimestral"
    estado: "procesado"
    archivo_raw: "data/01_raw/enacom_internet_penetracion_raw.csv"
    script_etl: "src/gis/fetch_conectividad.py"
    notas: "Accesos a internet fijo cada 100 hogares y cada 100 habitantes por provincia hasta 2026-T2."

  - nombre: "ENACOM — Velocidad Media de Descarga"
    dimension: "conectividad"
    fuente_oficial: "ENACOM / datos.gob.ar"
    url: "https://indicadores.enacom.gob.ar/Files/DatosAbiertos/internet_velocidad_media_descarga_provincias.csv"
    fecha_corte: "2026-06-30"
    periodicidad: "trimestral"
    estado: "procesado"
    archivo_raw: "data/01_raw/enacom_internet_velocidad_raw.csv"
    script_etl: "src/gis/fetch_conectividad.py"
    notas: "Velocidad media de bajada (Mbps) por provincia hasta 2026-T2."

  - nombre: "CABASE — Nodos IXP (Puntos de Intercambio de Tráfico)"
    dimension: "conectividad"
    fuente_oficial: "Cámara Argentina de Internet (CABASE)"
    url: "https://www.cabase.org.ar/red-nacional-de-puntos-de-intercambio-de-trafico-ixp/"
    fecha_corte: "2024-01-01"
    periodicidad: "anual"
    estado: "borrador"
    archivo_raw: "data/01_raw/cabase_ixp_nodos_manual.csv"
    script_etl: "src/gis/fetch_conectividad.py"
    notas: "Portal web sin API ni CSV abierto tabular descargable de forma estática. Variable ixp_cabase_nodos mantenida en NaN explícito (100% auditable) a la espera de carga manual formal."

  - nombre: "CEP XXI — Puestos de Trabajo Asalariados Registrados por Provincia y CLAE2"
    dimension: "talento"
    fuente_oficial: "CEP XXI / Secretaría de Industria y Desarrollo Productivo / datos.gob.ar"
    url: "https://cdn.produccion.gob.ar/cdn-cep/datos-por-provincia/por-provincia-clae2/puestos/puestos_priv.csv"
    fecha_corte: "2023-11-01"
    periodicidad: "mensual"
    estado: "procesado"
    archivo_raw: "data/01_raw/cepxxi_puestos_trabajo_clae2_provincias_raw.csv"
    script_etl: "src/etl/fetch_talento_riesgo.py"
    notas: "Panel mensual de puestos privados registrados por provincia y CLAE a 2 dígitos. Base para extraer puestos_software_clae62, puestos_tic_clae61_63, puestos_privados_totales, pct_empleo_tic_privado y densidad_stem_it_score."

  - nombre: "INPRES — Zonificación Sísmica (Reglamento INPRES-CIRSOC 103)"
    dimension: "talento"
    fuente_oficial: "Instituto Nacional de Prevención Sísmica (INPRES)"
    url: "https://www.inpres.gob.ar/zonas_result.php"
    fecha_corte: "2024-01-01"
    periodicidad: "reglamentaria"
    estado: "procesado"
    archivo_raw: "data/01_raw/inpres_zonificacion_24_raw.json"
    script_etl: "src/etl/fetch_talento_riesgo.py"
    notas: "Zonificación sísmica oficial (escala 0 a 4) determinada por consulta al endpoint oficial del INPRES para cada capital provincial según coordenadas WGS84."

  - nombre: "SPU — Estadísticas Universitarias STEM"
    dimension: "talento"
    fuente_oficial: "Secretaría de Políticas Universitarias (SPU) / Ministerio de Capital Humano"
    url: "https://datos.gob.ar/dataset/educacion-superior"
    fecha_corte: "2023-01-01"
    periodicidad: "anual"
    estado: "borrador"
    archivo_raw: "data/01_raw/spu_graduados_stem_provincial.csv"
    script_etl: "src/etl/fetch_talento_riesgo.py"
    notas: "Microdatos abiertos no desagregan por las 24 provincias (solo macrorregiones). Variable graduados_stem_anual mantenida en NaN explícito."
