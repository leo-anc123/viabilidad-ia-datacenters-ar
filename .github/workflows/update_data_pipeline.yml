name: Data Pipeline Continuous Ingestion & Quality Gate

on:
  schedule:
    # Ejecución programada los días 1 y 15 de cada mes a las 06:00 UTC
    - cron: '0 6 1,15 * *'
  workflow_dispatch:
    # Permite ejecución manual bajo demanda desde GitHub Actions

permissions:
  contents: write

jobs:
  run-pipeline-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute End-to-End Pipeline
        run: |
          python src/pipeline/run_full_pipeline.py --mode full

      - name: Strict Quality Gate (Validation Suite)
        run: |
          python src/etl/validate_master.py data/03_processed/master_24_jurisdicciones.parquet
          python src/modeling/validate_mcda.py
          python src/modeling/validate_fase3.py

      - name: Verify Diff and Commit Updates
        run: |
          # Verificar si existen cambios generados en datos procesados, outputs o docs
          if [ -n "$(git status --porcelain data/ config/ docs/qa_report_fase2.md)" ]; then
            echo "Cambios detectados tras la ejecución del pipeline. Preparando commit..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/02_interim/ data/03_processed/ data/04_outputs/ config/data_sources.yaml docs/qa_report_fase2.md
            git commit -m "chore(data): automated bi-weekly pipeline refresh and freshness trace [skip ci]"
            git push origin main
          else
            echo "No se detectaron diferencias en los archivos de salida. Commit omitido."
          fi
